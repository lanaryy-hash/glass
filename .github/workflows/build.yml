# À chaque envoi du code : Glass pour Windows et pour Mac, puis une « version » GitHub (vN) avec les deux.
# Les Glass déjà installées la voient et proposent « Mise à jour disponible ».
name: Glass
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GLASS_VERSION: ${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Moteur Spotify (Rust)
        working-directory: engine
        run: cargo build --release

      - name: Glass.exe
        run: |
          cmake -S . -B build -DGLASS_VERSION=${{ env.GLASS_VERSION }}
          cmake --build build --config Release
          Copy-Item engine/target/release/glass-engine.exe build/Release/
          Compress-Archive -Path build/Release/Glass.exe, build/Release/glass-engine.exe, build/Release/Glass.pdb -DestinationPath Glass-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Glass-windows
          path: Glass-windows.zip

  mac:
    runs-on: macos-15  # macos-14 retiré par GitHub (nov. 2026)
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4

      - name: Moteur Spotify (Rust, les deux processeurs)
        working-directory: engine
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output ../glass-engine target/aarch64-apple-darwin/release/glass-engine target/x86_64-apple-darwin/release/glass-engine

      - name: Paroles par IA (whisper.cpp)
        run: |
          git clone --depth 1 --branch v1.8.7 https://github.com/ggml-org/whisper.cpp
          for a in arm64 x86_64; do
            cmake -S whisper.cpp -B wb-$a -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_METAL=OFF -DGGML_NATIVE=OFF \
              -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DCMAKE_OSX_ARCHITECTURES=$a
            cmake --build wb-$a --config Release -j 4 --target whisper-cli
          done
          lipo -create -output whisper-cli $(find wb-arm64 -name whisper-cli -type f -perm +111) $(find wb-x86_64 -name whisper-cli -type f -perm +111)

      - name: Icône
        run: |
          mkdir Glass.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/glass-1024.png --out Glass.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) assets/glass-1024.png --out Glass.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns Glass.iconset -o assets/Glass.icns

      - name: Glass.app
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DGLASS_VERSION=${{ env.GLASS_VERSION }}
          cmake --build build -j 4
          cp glass-engine whisper-cli build/Glass.app/Contents/MacOS/
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ env.GLASS_VERSION }}" -c "Set :CFBundleVersion ${{ env.GLASS_VERSION }}" build/Glass.app/Contents/Info.plist
          codesign --force --deep -s - build/Glass.app
          ditto -c -k --keepParent build/Glass.app Glass-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Glass-mac
          path: Glass-mac.zip

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publier la version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v${{ env.GLASS_VERSION }}" Glass-windows.zip Glass-mac.zip -R "${{ github.repository }}" \
            --title "Glass ${{ env.GLASS_VERSION }}" --notes "$NOTES"
